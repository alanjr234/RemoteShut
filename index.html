
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">

    <title>Remote Shutdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="icon">⌁</div>

        <h1>Remote Shutdown</h1>
        <p class="subtitle">Control your laptop from anywhere.</p>

        <div class="status-card">
            <span class="status-dot"></span>
            <div>
                <strong>My Laptop</strong>
                <p id="status">Connection status not checked</p>
            </div>
        </div>

        <button id="shutdownBtn">
            Shut Down Laptop
        </button>

        <p class="note">
            Make sure you have saved all your work.
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
